# RabbitMQ props
consumer.queue.host=192.168.1.155
consumer.queue.port=5672
consumer.queue.name=dev-opr8r-mo_sms
consumer.queue.routingKey=us.dev.mo
consumer.queue.durable=true

# For OperatorMessageFlowIT, the producer here is playing the part of the Rcvr. A non-Rabbit queue will be used for MT output.
producer.queue.host=192.168.1.155
producer.queue.port=5672
producer.queue.name=dev-opr8r-mo_sms
producer.queue.routingKey=us.dev.mo
producer.queue.durable=true

# Brbl specific props for using queues
consumerClass=com.enoughisasgoodasafeast.OperatorConsumer


# Postgres props
user=brbl_operator
password=brbl_operator
ssl=false
preparedStatementCacheQueries=10

# Connection pool (c3p0) config
driverClass=org.postgresql.Driver
jdbcUrl=jdbc:postgresql://192.168.1.155:5432/brbl_db_dev?currentSchema=brbl_biz,brbl_history,brbl_logic,brbl_logs_2,brbl_users
#jdbcUrl=jdbc:postgresql://host.docker.internal:5432/brbl_db_dev
initialPoolSize=3
minPoolSize=2
maxPoolSize=4
acquireIncrement=2
