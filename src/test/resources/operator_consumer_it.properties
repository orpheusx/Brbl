# RabbitMQ consumer props (host/port overridden at runtime by RabbitMQContainer)
consumer.queue.host=localhost
consumer.queue.port=5672
consumer.queue.name=opr8r-consumer-it_sms
consumer.queue.routingKey=us.it.mo
consumer.queue.durable=true

# Producer (rcvr surrogate) mirrors consumer so it publishes to the same queue
producer.queue.host=localhost
producer.queue.port=5672
producer.queue.name=opr8r-consumer-it_sms
producer.queue.routingKey=us.it.mo
producer.queue.durable=true

# Brbl specific props
consumerClass=com.enoughisasgoodasafeast.OperatorConsumer
